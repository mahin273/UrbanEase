<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Profile & Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 py-10">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Profile</h2>
        <div class="flex items-center space-x-4 mb-6">
            <img src="https://via.placeholder.com/100" alt="Profile Picture" class="w-24 h-24 rounded-full border">
            <div>
                <h3 class="text-xl font-semibold text-gray-700">User Name</h3>
                <p class="text-gray-500">username@example.com</p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div><strong>First Name:</strong> John</div>
            <div><strong>Last Name:</strong> Doe</div>
            <div><strong>NID Number:</strong> 123456789</div>
            <div><strong>Email:</strong> john.doe@example.com</div>
            <div>
                <label for="phone" class="font-bold">Phone Number:</label>
                <input type="text" id="phone" placeholder="Enter phone number" class="border p-2 w-full rounded">
            </div>
            <div>
                <label for="gender" class="font-bold">Gender:</label>
                <input type="text" id="gender" placeholder="Enter gender" class="border p-2 w-full rounded">
            </div>
            <div>
                <label for="dob" class="font-bold">DOB:</label>
                <input type="date" id="dob" class="border p-2 w-full rounded">
            </div>
            <div>
                <label for="city" class="font-bold">City:</label>
                <input type="text" id="city" placeholder="Enter city" class="border p-2 w-full rounded">
            </div>
            <div>
                <label for="postcode" class="font-bold">Post Code:</label>
                <input type="text" id="postcode" placeholder="Enter post code" class="border p-2 w-full rounded">
            </div>
        </div>
        <button class="mt-4 bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Update Profile</button>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Staff Dashboard</h2>
        <div class="grid grid-cols-2 gap-4 text-center">
            <div class="p-4 border rounded-lg shadow-md">
                <h3 class="text-xl font-bold text-gray-700">Assigned Tasks</h3>
                <p class="text-gray-600">10</p>
            </div>
            <div class="p-4 border rounded-lg shadow-md">
                <h3 class="text-xl font-bold text-gray-700">Tasks Near Deadline</h3>
                <p class="text-gray-600">3</p>
            </div>
            <div class="p-4 border rounded-lg shadow-md">
                <h3 class="text-xl font-bold text-gray-700">Total Resolved Tasks</h3>
                <p class="text-gray-600">15</p>
            </div>
        </div>
        <button class="mt-6 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700">Update Task Status</button>
    </div>
</body>

</html>
