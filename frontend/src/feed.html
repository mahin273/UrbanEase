<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="auth.js"></script>
    <style>
        .form-button {
            background-color: #3182ce;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .form-button:hover {
            background-color: #2b6cb0;
        }

        .main-content {
            overflow-y: auto;
            max-height: calc(100vh - 40px);
            flex-grow: 1;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
        }
    </style>
</head>

<body class="bg-gray-100 py-10">

    <div class="flex max-w-7xl mx-auto">

        <div class="w-1/4 bg-white p-6 rounded-lg shadow-lg sidebar">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">UrbanEase</h2>
            <ul class="space-y-6">
                <li><a href="feed.html" class="text-lg font-semibold text-gray-700 hover:text-blue-600">Community
                        Feed</a></li>
                <li><a id="dashboard-link" href="#" class="text-lg font-semibold text-gray-700 hover:text-blue-600">Profile &
                        Dashboard</a></li>

                <li><a href="#" class="text-lg font-semibold text-gray-700 hover:text-blue-600">Notifications</a></li>
                <li><a href="settings.html" class="text-lg font-semibold text-gray-700 hover:text-blue-600">Settings</a>
                </li>
            </ul>
        </div>

        <div class="w-2/3 ml-6 main-content">

            <div class="bg-white p-6 rounded-lg shadow-lg mb-8 form-container">
                <h3 class="text-2xl font-semibold text-gray-700 mb-4">Create Report</h3>

                <form id="reportForm" action="#" method="POST">
                    <div class="mb-4">
                        <label for="title" class="block text-gray-700">Title</label>
                        <input type="text" id="title" name="title" placeholder="Enter report title"
                            class="border p-3 w-full rounded-lg">
                    </div>

                    <div class="mb-4">
                        <label for="description" class="block text-gray-700">Description</label>
                        <textarea id="description" name="description" placeholder="Describe the issue..." rows="3"
                            class="border p-3 w-full rounded-lg"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="category" class="block text-gray-700">Category</label>
                        <select id="category" name="category" class="border p-3 w-full rounded-lg">
                            <option value="Public Safety">Public Safety</option>
                            <option value="Infrastructure">Infrastructure</option>
                            <option value="Environmental Issues">Environmental Issues</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Crime and Law">Crime and Law</option>
                            <option value="Emergency Services">Emergency Services</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="location" class="block text-gray-700">Location</label>
                        <input type="text" id="location" name="location" placeholder="Enter location"
                            class="border p-3 w-full rounded-lg">
                    </div>

                    <div class="mb-4">
                        <label for="google_maps_link" class="block text-gray-700">Google Maps Link</label>
                        <input type="url" id="google_maps_link" name="google_maps" placeholder="Enter Google Maps link"
                            class="border p-3 w-full rounded-lg">
                    </div>

                    <div class="mb-4">
                        <label for="file" class="block text-gray-700">Upload Picture</label>
                        <input type="file" id="file" name="file" class="border p-3 w-full rounded-lg">
                    </div>

                    <button type="submit" class="form-button">Submit Report</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-lg feed-reports">
                <h3 class="text-2xl font-semibold text-gray-700 mb-6">User Reports</h3>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('reportForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const formData = new FormData(this);

            try {
                const response = await fetch('http://localhost:4001/api/reports/create', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    fetchReports();
                }
            } catch (error) {
                console.error('Error creating report:', error);
            }
        });

    async function fetchReports() {
        try {
            const response = await fetch('http://localhost:4001/api/reports');
            const reports = await response.json();

            const reportsContainer = document.querySelector('.feed-reports');
            reportsContainer.innerHTML = '';

            const upvotedReports = JSON.parse(localStorage.getItem('upvotedReports')) || [];  // Get upvoted report IDs

            reports.forEach(report => {
                const reportElement = document.createElement('div');
                reportElement.classList.add('mb-8', 'border-b', 'pb-6');

                const imageUrl = report.image_url ? `http://localhost:4001${report.image_url}` : 'https://via.placeholder.com/150';

                let upvoted = upvotedReports.includes(report.report_id);  // Check if the report is upvoted

                reportElement.innerHTML = `
                <h4 class="text-xl font-semibold text-gray-800">${report.username}</h4>
                <p class="text-lg text-gray-700">${report.title}</p>
                <p class="text-sm text-gray-600">Category: ${report.category_name}</p>
                <p class="text-sm text-gray-600">Description: ${report.description}</p>
                <p class="text-sm text-gray-600">Location: ${report.location}</p>
                <a href="${report.google_maps_link}" class="text-blue-600 hover:underline">View on Google Maps</a>
                <img src="${imageUrl}" class="mt-4 rounded-lg" style="width: 800px; height: 400px;">
                <div class="mt-4 flex space-x-4">
                    <button class="text-blue-500 upvote-button" 
                            onclick="upvoteReport(${report.report_id}, this)" 
                            ${upvoted ? 'disabled' : ''}>
                        ${upvoted ? 'Upvoted' : 'Upvote'}
                    </button>
                    <button class="text-gray-500" onclick="toggleCommentForm(${report.report_id})">Comment</button>
                    <span class="ml-4 text-gray-700" id="vote-count-${report.report_id}">
                        Votes: ${report.vote_count !== undefined ? report.vote_count : 0}
                    </span>
                </div>
                <div class="comment-section" id="comment-section-${report.report_id}" style="display: none;">
                    <textarea id="comment-text-${report.report_id}" class="border p-2 w-full rounded-lg" placeholder="Add a comment..."></textarea>
                    <button class="form-button mt-2" onclick="addComment(${report.report_id})">Submit Comment</button>
                    <div class="comments-list" id="comments-list-${report.report_id}">
                    </div>
                </div>
            `;

                reportsContainer.appendChild(reportElement);
            });
        } catch (error) {
            console.error('Error fetching reports:', error);
        }
    }

        document.getElementById('reportForm').addEventListener('submit', async function (event) {
                event.preventDefault();
                const formData = new FormData(this);

                const token = localStorage.getItem('authToken'); // Get the JWT token

                if (!token) {
                    alert('You need to log in first.');
                    return;
                }

                try {
                    // Decode JWT to get user_id (assuming JWT is in the standard format)
                    const payload = JSON.parse(atob(token.split('.')[1])); // Decode token to get payload
                    const user_id = payload.id;  // Correct field is 'id' instead of 'user_id'

                    if (!user_id) {
                        alert('Invalid user session. Please log in again.');
                        return;
                    }

                    // Get category_id from the selected option
                    const categorySelect = document.getElementById('category');
                    const category_id = categorySelect.value;

                    if (!category_id) {
                        alert('Please select a category.');
                        return;
                    }

                    // Append required fields to formData
                    formData.append('user_id', user_id);
                    formData.append('category_id', category_id);

                    const response = await fetch('http://localhost:4001/api/reports/create', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}` // Add the token to the request header
                        },
                        body: formData,
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Report created successfully:', data);
                        fetchReports(); // Reload the reports
                        alert('Report created successfully.');
                    } else {
                        const data = await response.json();
                        console.log("Data: ",data)
                        console.error('Error creating report:', data.error);
                        alert('Error: ' + (data.error || 'Unable to create report.'));
                    }
                } catch (error) {
                    console.error('Error creating report:', error);
                    alert('An error occurred while submitting the report.');
                }
            });



    async function upvoteReport(reportId, buttonElement) {
            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    alert('You need to log in first.');
                    return;
                }

                const response = await fetch('http://localhost:4001/api/upvote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ reportId })
                });

                const data = await response.json();

                if (response.ok) {
                    // Update the vote count
                    document.getElementById(`vote-count-${reportId}`).textContent = `Votes: ${data.voteCount}`;

                    // Store the upvoted report ID in localStorage
                    let upvotedReports = JSON.parse(localStorage.getItem('upvotedReports')) || [];
                    upvotedReports.push(reportId);
                    localStorage.setItem('upvotedReports', JSON.stringify(upvotedReports));

                    // Change button text to "Upvoted" and disable it
                    buttonElement.textContent = 'Upvoted';
                    buttonElement.disabled = true;
                } else {
                    alert('Error: ' + (data.error || 'Unable to upvote.'));
                }
            } catch (error) {
                console.error('Error upvoting report:', error);
                alert('An error occurred while upvoting.');
            }
        }

    async function removeUpvote(reportId, buttonElement) {
        try {
            const token = localStorage.getItem('authToken'); // Use correct key
            if (!token) {
                alert('You need to log in first.');
                return;
            }

            const response = await fetch('http://localhost:4001/api/upvote/remove-vote', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`, // Use token stored in localStorage
                },
                body: JSON.stringify({ reportId })
            });

            const data = await response.json();

            if (response.ok) {
                // Update the vote count
                document.getElementById(`vote-count-${reportId}`).textContent = `Votes: ${data.voteCount}`;

                // Change button text back to "Upvote"
                buttonElement.textContent = 'Upvote';
                buttonElement.setAttribute('onclick', `upvoteReport(${reportId}, this)`);
            } else {
                alert('Error: ' + (data.error || 'Unable to remove vote.'));
            }
        } catch (error) {
            console.error('Error removing upvote:', error);
            alert('An error occurred while removing the upvote.');
        }
    }
    function toggleCommentForm(reportId) {
            const commentSection = document.getElementById(`comment-section-${reportId}`);
            commentSection.style.display = commentSection.style.display === 'none' ? 'block' : 'none';

            // Fetch existing comments when the form is opened
            if (commentSection.style.display === 'block') {
                fetchComments(reportId);
            }
        }

        async function addComment(reportId) {
                const commentText = document.getElementById(`comment-text-${reportId}`).value;
                const token = localStorage.getItem('authToken');

                if (!token) {
                    alert('You need to log in first.');
                    return;
                }

                if (!commentText) {
                    alert('Please enter a comment.');
                    return;
                }

                try {
                    const response = await fetch(`http://localhost:4001/api/reports/${reportId}/comments`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`,
                        },
                        body: JSON.stringify({ commentText }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        document.getElementById(`comment-text-${reportId}`).value = '';  // Clear the comment box
                        fetchComments(reportId);  // Refresh comments
                    } else {
                        alert('Error adding comment: ' + (data.error || 'Unknown error.'));
                    }
                } catch (error) {
                    console.error('Error adding comment:', error);
                    alert('An error occurred while adding the comment.');
                }
            }

            async function fetchComments(reportId) {
                    try {
                        const response = await fetch(`http://localhost:4001/api/reports/${reportId}/comments`);
                        const data = await response.json();

                        const commentsList = document.getElementById(`comments-list-${reportId}`);
                        commentsList.innerHTML = '';  // Clear existing comments

                        data.comments.forEach(comment => {
                            const commentElement = document.createElement('div');
                            commentElement.classList.add('comment', 'my-2');
                            commentElement.innerHTML = `
                <div class="text-sm text-gray-700">${comment.username}</div>
                <div class="text-sm text-gray-600">${comment.comment_text}</div>
            `;
                            commentsList.appendChild(commentElement);
                        });
                    } catch (error) {
                        console.error('Error fetching comments:', error);
                    }
                }

  function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1]; // Get payload section
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(
                atob(base64)
                    .split('')
                    .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                    .join('')
            );
            return JSON.parse(jsonPayload);
        } catch (error) {
            console.error('Invalid JWT token:', error);
            return null;
        }
    }

    // Main function to check role and redirect
    document.addEventListener("DOMContentLoaded", function () {
        const token = localStorage.getItem('authToken');

        if (!token) {
            console.warn('No auth token found. Redirecting to login page.');
            window.location.href = 'login.html';  // Redirect if no token found
            return;
        }

        const decodedToken = parseJwt(token);

        if (!decodedToken || !decodedToken.role) {
            console.warn('Invalid token or role not found. Redirecting to login.');
            window.location.href = 'login.html';
            return;
        }

        console.log("User Role from token: ", decodedToken.role);

        // Get dashboard link and set it based on role
        const dashboardLink = document.getElementById('dashboard-link');
        dashboardLink.href = decodedToken.role === 'admin' ?
            'admin-profile-dashboard.html' :
            'user-profile-dashboard.html';
    });



        fetchReports();
              
    </script>
</body>

</html>
