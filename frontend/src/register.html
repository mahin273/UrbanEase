<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">User Registration</h2>

        <form id="registrationForm">
            <!-- First Name -->
            <div class="mb-4">
                <label for="firstname" class="block text-gray-700">First Name</label>
                <input type="text" id="firstname" name="firstname"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    required>
            </div>

            <!-- Last Name -->
            <div class="mb-4">
                <label for="lastname" class="block text-gray-700">Last Name</label>
                <input type="text" id="lastname" name="lastname"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    required>
            </div>

            <!-- Username -->
            <div class="mb-4">
                <label for="username" class="block text-gray-700">Username</label>
                <input type="text" id="username" name="username"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    required>
            </div>

            <!-- NID Number -->
            <div class="mb-4">
                <label for="nid_num" class="block text-gray-700">NID Number</label>
                <input type="text" id="nid_num" name="nid_num"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    required>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" name="email"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    required>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    required>
            </div>

            <!-- Submit Button -->
            <div class="mb-4">
                <button type="submit"
                    class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition">
                    Register
                </button>
            </div>

        </form>

        <!-- Error Message -->
        <div id="errorMessage" class="text-red-500 text-center mt-4 hidden">
            <p>There was an error with your registration.</p>
        </div>

    </div>

    <script>
        // Handle form submission
        document.getElementById('registrationForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch('http://localhost:4001/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        firstname: formData.get('firstname'),
                        lastname: formData.get('lastname'),
                        username: formData.get('username'),
                        nid_num: formData.get('nid_num'),
                        email: formData.get('email'),
                        password: formData.get('password'),
                    })
                });

                const data = await response.json();

                if (response.status === 201) {
                    alert('User registered successfully!');
                    window.location.href = 'login-user.html'; // Redirect to login page
                } else {
                    throw new Error(data.error || 'Registration failed');
                }

            } catch (error) {
                document.getElementById('errorMessage').classList.remove('hidden');
                console.error('Error:', error);
            }
        });
    </script>

</body>

</html>
