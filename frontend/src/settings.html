<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Settings</h2>

        <!-- Password Change Button -->
        <div class="mb-4">
            <a href="password-change.html"
                class="w-full block text-center bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Change Password
            </a>
        </div>

        <!-- Logout Button -->
        <div class="mb-4">
            <button id="logoutButton"
                class="w-full block text-center bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">
                Logout
            </button>
        </div>

    </div>

    <!-- Logout script -->
    <script>
        document.getElementById('logoutButton').addEventListener('click', () => {
            // Clear the token from localStorage
            localStorage.removeItem('token');

            // Redirect to login page
            window.location.href = 'login-user.html';
        });
    </script>
</body>

</html>
