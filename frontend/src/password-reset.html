<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Reset Password</h2>

        <form id="resetPasswordForm" method="POST">
            <div class="mb-4">
                <label for="newPassword" class="block text-gray-700 font-medium mb-2">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Enter new password">
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="block text-gray-700 font-medium mb-2">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Confirm your password">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Reset Password</button>
        </form>

        <p class="mt-4 text-center text-gray-600">
            Remember your password?
            <a href="login.html" class="text-blue-600 hover:underline">Login here</a>
        </p>
    </div>

    <!-- Reset password script -->
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
            event.preventDefault(); 

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            console.log('Extracted token:', token); 

            if (!token) {
                alert('Invalid or missing token.');
                return;
            }

            // Check if passwords match
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            // Prepare data to send
            const data = {
                token: token,
                password: newPassword
            };

            try {
                // Send password reset request to the backend
                const response = await axios.post('http://localhost:4001/api/users/reset-password', data, {
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.data.message) {
                    alert('Password reset successful. Please log in.');
                    window.location.href = 'login-user.html';  // Redirect to login page
                } else {
                    alert('Error: ' + response.data.error);
                }
            } catch (error) {
                console.error('Error resetting password:', error);
                alert('Error connecting to the server. Please try again later.');
            }
        });

        
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                alert('Invalid or missing token.');
            }

            document.getElementById('newPassword').focus();
        };
    </script>

</body>

</html>
